# /etc/nginx/sites-available/jogo, installed once by hand (see the README's deploy section), then:
#   certbot --nginx --no-redirect -d jogo.pericles.dev.br
# certbot adds the 443 lines to the installed copy, so do not overwrite it blindly; edit it in place.
# Cloudflare proxies the domain and terminates TLS for players; this serves the static site that
# ops/jogo-deploy publishes into /srv/jogo/www.
server {
    listen 80;
    server_name jogo.pericles.dev.br;
    root /srv/jogo/www;

    # the entry point redirects to the current build: always revalidate it
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # builds live under their tree hash and never change
    location /jogo/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # load-bearing: the page query string reaches the browser's os.environ (PYGPI), so the game may
        # only connect to this origin; no COOP/COEP (they would break the OAuth popup later)
        add_header Content-Security-Policy "frame-ancestors 'none'; connect-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # the pygbag runtime mirror (hash-locked in web/cdn.lock)
    # ponytail: immutable even for its unversioned paths (vtx.js, vt/); purge Cloudflare's cache on a pygbag upgrade
    location /cdn/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;  # pygbag's own hidden iframe
        add_header X-Content-Type-Options nosniff always;
    }
}
