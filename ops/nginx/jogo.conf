# /etc/nginx/sites-available/jogo, installed by ops/setup.sh (which keeps the previous copy as jogo.bak, runs
# nginx -t and puts the old file back if it fails). The TLS lines are the ones certbot wrote
# (certbot --nginx --no-redirect -d jogo.pericles.dev.br); its renewals only reload nginx.
# Cloudflare proxies the domain and terminates TLS for players. /jogo/ and /cdn/ are the static files
# ops/jogo-deploy publishes into /srv/jogo/www; everything else is the app (jogo.service on 127.0.0.1:8090).

# WebSocket upgrade (the game's /ws, M3); a name of our own: other sites on this nginx may map the usual one
map $http_upgrade $jogo_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jogo.pericles.dev.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jogo.pericles.dev.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    server_name jogo.pericles.dev.br;
    root /srv/jogo/www;

    # https only: Cloudflare passes on the scheme the visitor used, so a page with a form is never served (nor a
    # password posted) over http. The app's pages add Strict-Transport-Security.
    if ($http_x_forwarded_proto != "https") {
        return 301 https://jogo.pericles.dev.br$request_uri;
    }

    # No access log, and only critical errors: nginx logs the request line (an emailed link's /senha?t= token)
    # and the player's address with every error, a 502 during a restart included, and players' addresses are
    # not kept (LGPD). The app's side of a failure is in journalctl -u jogo.
    access_log off;
    error_log /var/log/nginx/jogo.error.log crit;
    client_max_body_size 16k;  # the site's forms only

    # The player's address: CF-Connecting-IP, believed only from Cloudflare's published ranges
    # (https://www.cloudflare.com/ips-v4 and /ips-v6, fetched 2026-10-20). A request from anywhere else keeps
    # its own address whatever it claims. ponytail: hardcoded; re-fetch when Cloudflare changes its ranges.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # builds live under their tree hash and never change (Cache-Control only on success: a 404 is not cached)
    location /jogo/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # load-bearing: the page query string reaches the browser's os.environ (PYGPI), so the game may
        # only connect to this origin; no COOP/COEP (they would break the OAuth popup later)
        add_header Content-Security-Policy "frame-ancestors 'none'; connect-src 'self'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # the pygbag runtime mirror (hash-locked in web/cdn.lock)
    # ponytail: immutable even for its unversioned paths (vtx.js, vt/); purge Cloudflare's cache on a pygbag upgrade
    location /cdn/ {
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "frame-ancestors 'self'" always;  # pygbag's own hidden iframe
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the app's request.client is the player (uvicorn trusts X-Forwarded-For from 127.0.0.1 only); these
        # replace whatever the client sent, and the raw CF header never reaches the app
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto https;  # anything else was redirected above
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jogo_connection_upgrade;
        proxy_read_timeout 120s;  # longer than Cloudflare's 100 s WebSocket idle limit
    }
}
