name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.14"  # the desktop build
          - python: "3.12.12"  # the web runtime (pygbag 0.9.3) and the server
            pygame: pygame-ce==2.5.7
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      JOGO_STRICT_ASSETS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]" ${{ matrix.pygame }}
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
